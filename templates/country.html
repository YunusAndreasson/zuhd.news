<!DOCTYPE html>
<html lang="en">
<head>
  {{headCommon}}
  <link rel="alternate" type="application/atom+xml" title="zuhd.news" href="/feed.xml">
  <title>{{name}} — zuhd.news</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="https://zuhd.news/country/{{iso2}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="zuhd.news">
  <meta property="og:title" content="{{name}} — zuhd.news">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="https://zuhd.news/country/{{iso2}}">
  <meta property="og:image" content="https://zuhd.news/api/og/country/{{iso2}}.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{name}} — country profile on zuhd.news">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://zuhd.news/api/og/country/{{iso2}}.png">
  <meta name="twitter:image:alt" content="{{name}} — country profile on zuhd.news">
</head>
<body class="archetype-page-body">
  {{archetypeHeader}}

  <main class="article-page-main">
    <article class="country-page">
      <div class="country-header">
        <span class="label">{{region}}</span>
        <span class="country-flag" aria-hidden="true">{{flag}}</span>
        <h1 class="t-data-numeral country-name">{{name}}</h1>
        <span class="label country-iso">{{iso2}}</span>
        <p class="t-caption country-meta">{{metaLine}}</p>
      </div>

      <section class="country-metrics">
        <h2 class="label section-title">Metrics</h2>
        <ol class="metric-list">
          {{metricRows}}
        </ol>
      </section>

      {{coverageSection}}
    </article>

    {{shareRow}}
  </main>

  <footer>
    <span class="update-status">{{footerStatus}}</span>
    {{footerNav}}
  </footer>
  <div data-island-auto="spacefield" aria-hidden="true"></div>
  <script type="module" src="/island-loader.js?v={{v}}" defer></script>
</body>
</html>
