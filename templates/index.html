<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zuhd.news — News for all humans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/" class="wordmark">zuhd.news</a>
    <p class="tagline">News for all humans.</p>
    <p class="nav-hint" aria-hidden="true"><span class="hint-nav">&larr;&rarr; categories · &uarr;&darr; headlines</span><span class="hint-enter"> · &crarr; read</span><span class="hint-reading">esc to return</span></p>
  </header>

  <main>
    <nav class="category-strip" role="tablist" aria-label="News categories"></nav>
    <section class="headline-list" role="tabpanel" aria-label="Headlines"></section>
    <article class="article-view" aria-live="polite" hidden>
      <div class="article-view-inner"></div>
    </article>
  </main>

  <noscript>
    <main>
      {{fallbackArticleList}}
    </main>
  </noscript>

  <footer>
    <p class="last-updated">Last updated: {{lastUpdated}}</p>
    <p>zuhd.news — News for all humans.</p>
  </footer>

  <div aria-live="polite" aria-atomic="true" class="sr-only" id="announcer"></div>

  <script type="application/json" id="article-data">{{articleDataJson}}</script>
  <script type="module" src="/reader.js"></script>
</body>
</html>
