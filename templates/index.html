  <!--
    The map's critical chain, declared so it starts downloading at parse time
    instead of after island-loader.js has run and resolved a dynamic import.

    countries.geojson is deliberately *not* preloaded: MapLibre loads GeoJSON
    sources on its worker, and the preload cache belongs to the document, so the
    hint was never claimable — the browser logged "preloaded but not used" and
    the file was fetched twice. Warming the worker's copy is the HTTP cache's
    job, which is what the /basemap/* rule in _headers is for.

    The three modulepreloads matter for the same reason in reverse: the worker
    imports maplibre-gl-shared.mjs as a sibling, so pulling it into the cache
    here is what stops the engine's shared chunk arriving twice.
  -->
  <link rel="preload" href="/api/map.json" as="fetch" type="application/json" crossorigin>
  <link rel="modulepreload" href="/islands/situation-map.js?v={{v}}">
  <link rel="modulepreload" href="/islands/maplibre-gl.mjs">
  <link rel="modulepreload" href="/islands/maplibre-gl-shared.mjs">

<body class="map-page">
  <header>
    {{wordmark}}
    {{audioBriefing}}
  </header>

  <main class="map-main">
    <h1 class="sr-only">zuhd.news — a live map of the last 14 days of world news</h1>
    <div class="map-shell" data-island-auto="situation-map" data-basemap="{{basemapV}}"></div>

  <noscript>

      {{fallbackArticleList}}
    </div>

  <footer>
    {{footerNav}}
  </footer>

  <script type="module" src="/island-loader.js?v={{v}}" defer></script>
</body>
</html>
