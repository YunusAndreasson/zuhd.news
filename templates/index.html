<!DOCTYPE html>
<html lang="en">
<head>
  {{headCommon}}
  <link rel="alternate" type="application/atom+xml" title="zuhd.news" href="/feed.xml">
  <title>zuhd.news</title>
  <meta name="description" content="Global news, no noise. Concise world news from 40 sources, curated by AI.">
  <link rel="canonical" href="https://zuhd.news/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="zuhd.news">
  <meta property="og:title" content="zuhd.news">
  <meta property="og:description" content="Global news, no noise. Concise world news from 40 sources, curated by AI.">
  <meta property="og:url" content="https://zuhd.news/">
  <meta property="og:image" content="https://zuhd.news/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header>
    <a href="/" class="wordmark">zuhd<span class="wordmark-dot">.</span><span class="wordmark-tld">news</span></a>
    {{audioBriefing}}
  </header>

  <main>
    <h1 class="sr-only">zuhd.news — Global news, no noise</h1>
    <nav class="category-strip" role="tablist" aria-label="News categories"></nav>
    <section class="headline-list" role="tabpanel" aria-label="Headlines"></section>
    <article class="article-view" aria-live="polite" hidden>
      <div class="article-view-inner"></div>
    </article>
  </main>

  <noscript>
    {{fallbackArticleList}}
  </noscript>
  <div aria-live="polite" aria-atomic="true" class="sr-only" id="announcer"></div>

  <footer>
    <span class="update-status"></span>
    <span class="vim-hint">vim: hjkl</span>
    <nav class="footer-links">
      <a href="/about">about</a> <a href="/contact">contact</a> <a href="/sources">sources</a> <a href="/mcp">mcp</a> <a href="/privacy">privacy</a> <a href="/support">support</a>
    </nav>
  </footer>

  <script type="application/json" id="article-data">{{articleDataJson}}</script>
  <script type="module">{{inlineJS}}</script>
</body>
</html>
