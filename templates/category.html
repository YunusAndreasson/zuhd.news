<!-- بسم الله الرحمن الرحيم -->
<!DOCTYPE html>
<html lang="en">
<head>
  {{headCommon}}
  <link rel="alternate" type="application/atom+xml" title="zuhd.news" href="/feed.xml">
  <title>{{catCap}} — zuhd.news</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="https://zuhd.news/c/{{cat}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="zuhd.news">
  <meta property="og:title" content="{{catCap}} — zuhd.news">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="https://zuhd.news/c/{{cat}}">
  <meta property="og:image" content="https://zuhd.news/api/og/c/{{cat}}.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{catCap}} on zuhd.news">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://zuhd.news/api/og/c/{{cat}}.png">
  <meta name="twitter:image:alt" content="{{catCap}} on zuhd.news">
</head>
<body class="archetype-page-body">
  {{archetypeHeader}}
  <main class="article-page-main">
    <article class="category-page">
      <header class="category-page-header">
        <span class="label">{{catCap}}</span>
        <h1 class="t-display category-page-title">{{catCap}}</h1>
        <p class="t-caption">{{count}} articles · last {{days}} days</p>
      </header>
      <ol class="category-article-list">{{rows}}</ol>
    </article>
    {{shareRow}}
  </main>
  <footer>
    {{footerNav}}
  </footer>
  <script type="module" src="/island-loader.js?v={{v}}" defer></script>
</body>
</html>
