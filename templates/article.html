<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — zuhd.news</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/" class="wordmark">zuhd.news</a>
  </header>

  <main>
    <article>
      <header class="article-header">
        <span class="category">{{category}}</span>
        <h1>{{title}}</h1>
        <div class="meta">
          <time>{{date}}</time>
          <span class="separator">·</span>
          <span>Source: <a href="{{sourceUrl}}">{{source}}</a></span>
        </div>
      </header>

      <div class="article-body">
        {{content}}
      </div>
    </article>
  </main>

  <footer>
    <p>zuhd.news — News for all humans.</p>
  </footer>
</body>
</html>
