<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <title>{{title}} — zuhd.news</title>
  <meta name="description" content="{{description}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="zuhd.news">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="https://zuhd.news/articles/{{slug}}.html">
  <meta property="og:image" content="https://zuhd.news/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://zuhd.news/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet"></noscript>
  <style>{{inlineCSS}}</style>
</head>
<body>
  <header>
    <a href="/" class="wordmark">zuhd.news</a>
  </header>

  <main>
    <article>
      <header class="article-header">
        <span class="category">{{category}}</span>
        <h1>{{title}}</h1>
        <div class="meta">
          <time>{{date}}</time>
          <span class="separator">·</span>
          <a href="{{sourceUrl}}">{{source}}</a>
        </div>
      </header>

      <div class="article-body">
        {{content}}
      </div>
    </article>
  </main>

  <footer>
    <a href="/about">about</a> <a href="/sources">sources</a> <a href="/navigation">navigation</a> <a href="/contact">contact</a> <a href="/privacy">privacy</a>
  </footer>
</body>
</html>
