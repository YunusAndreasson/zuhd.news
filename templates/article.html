<!DOCTYPE html>
<html lang="en">
<head>
  {{headCommon}}
  <title>{{title}} — zuhd.news</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="https://zuhd.news/articles/{{slug}}.html">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="zuhd.news">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="https://zuhd.news/articles/{{slug}}.html">
  <meta property="og:image" content="https://zuhd.news/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="article:published_time" content="{{isoDate}}">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header>
    <a href="/" class="wordmark">zuhd<span class="wordmark-tld">.news</span></a>
  </header>

  <main>
    <article>
      <header class="article-header">
        <span class="category">{{category}}</span>
        <h1>{{title}}</h1>
        <div class="meta">
          <time datetime="{{isoDate}}">{{date}}</time>
          <span class="separator">·</span>
          <a href="{{sourceUrl}}">{{source}}</a>
        </div>
      </header>

      <div class="article-body">
        {{content}}
      </div>
    </article>
  </main>

  <footer>
    <nav class="footer-links">
      <a href="/about">about</a> <a href="/sources">sources</a> <a href="/privacy">privacy</a>
    </nav>
  </footer>
</body>
</html>
