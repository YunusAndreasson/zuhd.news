<!DOCTYPE html>
<html lang="en">
<head>
  {{headCommon}}
  <title>zuhd.news — {{pageName}}</title>
  <meta name="description" content="Global news, no noise. Concise world news from 40 sources, curated by AI.">
  <link rel="canonical" href="https://zuhd.news/{{pageName}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="zuhd.news">
  <meta property="og:title" content="zuhd.news — {{pageName}}">
  <meta property="og:description" content="Global news, no noise. Concise world news from 40 sources, curated by AI.">
  <meta property="og:url" content="https://zuhd.news/{{pageName}}">
  <meta property="og:image" content="https://zuhd.news/og-image.png?v=2">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="zuhd.news — global news, no noise">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://zuhd.news/og-image.png?v=2">
  <meta name="twitter:image:alt" content="zuhd.news — global news, no noise">
</head>
<body class="doc-page">
  <header>
    {{wordmark}}
    <a href="/" class="doc-back">← map</a>
  </header>

  <main>
    <article class="doc-panel">
      <h1 class="page-title">{{pageName}}</h1>
      <div class="about-body">
        {{content}}
      </div>
    </article>
  </main>

  <footer>
    {{footerNav}}
  </footer>

  <script type="module" src="/island-loader.js?v={{v}}" defer></script>
</body>
</html>
