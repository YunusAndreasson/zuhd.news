steps:
  - await:
      visible:
        text: Daily briefing
      timeout: 10000
  - echo: Swipe left from News to Markets; expect the Markets card deck to settle.
  - swipe:
      from: { x: 0.82, y: 0.55 }
      to: { x: 0.18, y: 0.55 }
      duration: 250
      momentum: true
  - echo: Page rapidly through Markets; every swipe must settle on one readable card
      and overflowing cards must scroll before paging.
  - swipe: { direction: up, duration: 220 }
  - swipe: { direction: up, duration: 220 }
  - swipe: { direction: up, duration: 220 }
  - swipe: { direction: up, duration: 220 }
  - swipe: { direction: up, duration: 220 }
  - swipe: { direction: up, duration: 220 }
  - echo: Burst-test forward and reverse vertical swipes; expect no half-settled
      page, skipped recognizer, or lost inner-scroll position.
