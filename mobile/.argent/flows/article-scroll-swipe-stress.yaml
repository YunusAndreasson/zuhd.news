            durationMs: 180
            momentum: true
          delayMs: 80
  - echo: Exercise slow inner scrolling and fast edge handoffs near the right edge.
  - swipe: { direction: up, duration: 400, momentum: false }
  - swipe: { direction: down, duration: 400, momentum: false }
  - swipe: { direction: up, duration: 400, momentum: false }
  - swipe: { direction: up, duration: 400, momentum: false }
  - swipe: { direction: down, duration: 400, momentum: false }
  - swipe:
      from: { x: 0.8, y: 0.22 }
      to: { x: 0.8, y: 0.82 }
      duration: 220
      momentum: true
  - swipe:
