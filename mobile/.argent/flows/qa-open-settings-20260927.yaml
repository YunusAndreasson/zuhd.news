executionPrerequisite: Android emulator-5554, home screen with no sheet open; menu will open at its root. System font scale 1.8–2.0.
steps:
  - tap:
      text: Menu
  - tool: await-ui-element
    args: {condition: visible, selector: {text: stock markets}, timeoutMs: 5000}
  - tool: gesture-swipe
    delayMs: 1000
    args: {fromX: 0.5, fromY: 0.85, toX: 0.5, toY: 0.25, momentum: false}
  - tool: gesture-swipe
    args: {fromX: 0.5, fromY: 0.85, toX: 0.5, toY: 0.3, momentum: false}
  - tap:
      text: settings & about
  - tool: describe
    delayMs: 1000
    args: {}
  - tap:
      text: settings
