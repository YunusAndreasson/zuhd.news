name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        type: choice
        options:
          - all
          - ios
          - android
        default: all

# Pushes the version commit and tag, and creates the GitHub release.
permissions:
  contents: write

defaults:
  run:
    working-directory: mobile

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5  # zizmor: ignore[artipacked] this job pushes the version commit and tag
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Bump version
        id: version
        run: |
          node scripts/bump.js
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        working-directory: .
        # The version reaches the shell as a variable, never as text spliced into the script.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add mobile/package.json mobile/app.json
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push origin HEAD
          git push origin "v$VERSION"

      - name: Setup EAS
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9.0.2
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        if: inputs.platform == 'all' || inputs.platform == 'android'
        run: eas build --platform android --profile production --non-interactive

      - name: Submit Android to Play Store (Internal)
        if: inputs.platform == 'all' || inputs.platform == 'android'
        run: eas submit --platform android --profile production --non-interactive --latest
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Build iOS
        if: inputs.platform == 'all' || inputs.platform == 'ios'
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Submit iOS to TestFlight
        if: inputs.platform == 'all' || inputs.platform == 'ios'
        run: eas submit --platform ios --profile production --non-interactive --latest
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Create GitHub Release
        if: success()
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
