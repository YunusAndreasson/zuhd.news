name: Checks

# The web surface had no CI at all until 2026-08-01 — release.yml is
# workflow_dispatch-only and runs entirely inside mobile/. Nothing checked
# scripts/, public/, shared/, functions/ or workers/ on push or PR, ever.
#
# paths-ignore is load-bearing, not tidiness. The editorial pipeline commits to
# master five times a day and every one of those commits touches only content/.
# Without the filter this workflow would run about 1,800 times a year to check
# nothing, and the failures that matter would be lost in the noise.

on:
  push:
    paths-ignore:
      - 'content/**'
      - 'logs/**'
      - 'mobile/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'content/**'
      - 'logs/**'
      - 'mobile/**'
      - '**/*.md'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The MCP worker is a separate package with its own deps and its own
      # lock file, and tsconfig.node.json deliberately typechecks it
      # ("workers/mcp/src/**/*.js" — the config's own header names it). A root
      # `npm ci` does not reach it, so Typecheck could not resolve
      # @modelcontextprotocol/sdk and failed on an import rather than on
      # anything a commit had changed. Installing it here keeps the worker
      # inside the gate; excluding it from the tsconfig would have taken the
      # only dynamic surface we deploy back out of CI to make CI go green.
      - name: Install MCP worker deps
        working-directory: workers/mcp
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dead code
        run: npm run deadcode

      # The real proof that the pipeline's modules still load and agree with
      # each other. SKIP_OG because the share-card rasteriser is the slow part
      # and renders nothing a type error could reach.
      - name: Build
        env:
          SKIP_OG: '1'
        run: node scripts/build.js

      # `npm test` is deliberately NOT run here, and that is not an oversight.
      # Several of those tests are ratchets over live state that does not exist
      # on a runner: logs.test.js reads recent cycle logs out of logs/ (which is
      # gitignored) and corpus.test.js asserts against the published corpus in
      # content/. They are a local and on-server check, run by `npm run verify`.
