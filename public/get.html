-->

<link rel="stylesheet" href="/style.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink-heading);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .wordmark { font-size: var(--type-heading); font-weight: var(--weight-title); letter-spacing: var(--track-display); margin: 0; }
  .wordmark-dot, .wordmark-tld { color: var(--ink-quiet); font-weight: 300; }
  .wordmark-dot { margin-inline: -0.04em; }
  .tag { color: var(--ink-prose); font-size: var(--type-item); line-height: 1.5; margin: 14px 0 34px; }
  .stores { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: block; text-decoration: none;
    color: var(--bg); background: var(--ink-heading);
    font-size: var(--type-item); font-weight: var(--weight-medium);
    padding: 15px 18px; border-radius: 12px;
    border: 1px solid var(--ink-heading);
  }
  .btn.secondary { color: var(--ink-heading); background: transparent; border-color: var(--line-edge); }
  .note { color: var(--ink-quiet); font-size: var(--type-label); margin-top: 26px; }
</style>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "9b35a0f25a0543849d0e830feb07a183"}'></script>
</head>
<body>
  <main>
    <h1 class="wordmark">zuhd<span class="wordmark-dot">.</span><span class="wordmark-tld">news</span></h1>
    <p class="tag">Global news that barely uses data.<br>No ads, no accounts.</p>
    <div class="stores">
      <a id="play" class="btn" href="https://play.google.com/store/apps/details?id=news.zuhd.app" rel="noopener">Get it on Google Play</a>
      <a id="ios" class="btn secondary" href="https://apps.apple.com/app/id6760964753" rel="noopener">Download on the App Store</a>
    </div>
    <p class="note">Text-first and lightweight — it works on slow connections.</p>
  </main>
</body>
</html>
