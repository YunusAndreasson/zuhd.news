<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get the zuhd.news app</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<!-- iOS Smart App Banner -->
<meta name="apple-itunes-app" content="app-id=6760964753">
<meta property="og:type" content="website">
<meta property="og:site_name" content="zuhd.news">
<meta property="og:title" content="Get the zuhd.news app">
<meta property="og:description" content="Global news that barely uses data. No ads, no accounts.">
<meta property="og:url" content="https://zuhd.news/get">
<!--
  noindex keeps this page out of search, but it is pasted into messages and ad
  previews constantly — and with no og:image every one of those rendered as a
  bare link. The card is the cheapest thing on the page and the only part of it
  most people ever see.
-->
<meta property="og:image" content="https://zuhd.news/og-image.png?v=3">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="zuhd.news — global news, no noise">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@zuhd_news">
<meta name="twitter:image" content="https://zuhd.news/og-image.png?v=3">
<meta name="twitter:image:alt" content="zuhd.news — global news, no noise">
<meta name="description" content="Global news that barely uses data. No ads, no accounts.">
<meta name="theme-color" content="#080a0d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/get.js"></script>
<link rel="preload" href="/fonts/source-sans-3-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground-dark);
    color: var(--ink-heading);
    font-family: var(--font-sans);
  }
  main {
    display: grid;
    grid-template-columns: minmax(18rem, 0.85fr) minmax(0, 1.15fr);
    align-items: center;
    gap: clamp(2rem, 6vw, 6rem);
    width: min(100% - 4rem, 74rem);
    min-height: 100svh;
    margin: auto;
    padding-block: var(--space-lg);
  }
  .app-icon { display: block; border-radius: 18px; }
  h1 {
    margin: var(--space-sm) 0 0;
    font-size: var(--type-title);
    font-weight: var(--weight-title);
    letter-spacing: var(--track-display);
    line-height: var(--leading-tight);
  }
  h1 span { color: var(--ink-quiet); font-weight: var(--weight-light); }
  .promise {
    margin: var(--space-sm) 0 var(--space-md);
    max-width: 25rem;
    font-size: var(--type-lede);
    letter-spacing: var(--track-heading);
    line-height: 1.38;
    color: var(--ink-prose);
    text-wrap: balance;
  }
  .stores { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .stores a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding-inline: 1.25rem;
    border-radius: 10px;
    color: var(--bg);
    background: var(--ink-heading);
    font-size: var(--type-item);
    font-weight: var(--weight-semibold);
    text-decoration: none;
  }
  .stores a:hover { background: var(--ink-prose); }
  a:focus-visible { outline: var(--ring-width) solid var(--focus); outline-offset: var(--ring-offset); }
  .scan {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    margin: var(--space-md) 0 0;
    padding-top: var(--space-md);
    border-top: 1px solid var(--line-divider);
    font-size: var(--type-item);
    color: var(--ink-quiet);
  }
  .scan img { display: block; border-radius: 6px; }
  .screens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-sm); }
  .screens img { display: block; width: 100%; height: auto; border: 1px solid var(--line-edge); border-radius: 12px; }
  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; width: min(100% - 2rem, 34rem); gap: var(--space-md); }
    .screens { gap: var(--space-xs); }
  }
</style>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "9b35a0f25a0543849d0e830feb07a183"}'></script>
</head>
<body>
  <main>
    <section aria-labelledby="app-name">
      <img class="app-icon" src="/apple-touch-icon.png" width="76" height="76" alt="">
      <h1 id="app-name">zuhd<span>.news</span></h1>
      <p class="promise">Global news that barely uses data. No ads, no accounts.</p>
      <div class="stores">
        <a id="ios" href="https://apps.apple.com/app/id6760964753" rel="noopener">Download on the App Store</a>
        <a id="play" href="https://play.google.com/store/apps/details?id=news.zuhd.app" rel="noopener">Get it on Google Play</a>
      </div>
      <figure class="scan">
        <img src="/app-preview/get-qr.svg" width="99" height="99" alt="QR code for https://zuhd.news/get">
        <figcaption>Scan with your phone</figcaption>
      </figure>
    </section>
    <div class="screens">
      <img src="/app-preview/map.webp" width="640" height="1391" alt="The day’s news, where it happened. Stories marked on the app’s globe.">
      <img src="/app-preview/story.webp" width="640" height="1391" alt="What happened, why it matters, what’s next. A dispatch open beneath its map.">
    </div>
  </main>
</body>
</html>
