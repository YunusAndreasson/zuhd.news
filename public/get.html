<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get the zuhd.news app</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<!-- iOS Smart App Banner -->
<meta name="apple-itunes-app" content="app-id=6760964753">
<meta property="og:type" content="website">
<meta property="og:site_name" content="zuhd.news">
<meta property="og:title" content="Get the zuhd.news app">
<meta property="og:description" content="Global news that barely uses data. No ads, no tracking, no accounts.">
<meta property="og:url" content="https://zuhd.news/get">
<!--
  noindex keeps this page out of search, but it is pasted into messages and ad
  previews constantly — and with no og:image every one of those rendered as a
  bare link. The card is the cheapest thing on the page and the only part of it
  most people ever see.
-->
<meta property="og:image" content="https://zuhd.news/og-image.png?v=3">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="zuhd.news — global news, no noise">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@zuhd_news">
<meta name="twitter:image" content="https://zuhd.news/og-image.png?v=3">
<meta name="twitter:image:alt" content="zuhd.news — global news, no noise">
<script>
// Fast path: redirect mobile visitors to their store from <head>, BEFORE the body
// paints, so Android/iOS don't pay for rendering a page they never see. Desktop /
// unknown clients fall through to the rendered page with both store buttons.
(() => {
  var PLAY = "https://play.google.com/store/apps/details?id=news.zuhd.app";
  var IOS = "https://apps.apple.com/app/id6760964753";
  var ua = navigator.userAgent || "";
  var qs = (location.search || "").replace(/^\?/, "");
  // Paid-only landing page (noindex): if the ad link carried no params, still
  // attribute the store visit to paid so Play's Install Referrer can read it
  // (control arm of the bridge-vs-direct destination test).
  if (!qs) qs = "utm_source=facebook&utm_medium=paid&utm_content=bridge";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
    (/Macintosh/.test(ua) && "ontouchend" in document); // iPadOS desktop-mode
  if (isAndroid) location.replace(`${PLAY}&referrer=${encodeURIComponent(qs)}`);
  else if (isIOS) location.replace(`${IOS}?${qs}`);
})();
</script>
<style>
  /* The site's face and its two-weight wordmark: this page was set in the
     system's sans under a masthead no other page wears. Only a desktop paints
     it (a phone has left by now), and the system stack still stands behind. */
  @font-face {
    font-family: 'Source Sans 3';
    font-style: normal;
    font-weight: 200 900;
    font-display: swap;
    size-adjust: 95%;
    src: url('/fonts/source-sans-3-var.woff2') format('woff2');
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #141414;
    color: #f2f2f2;
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .wordmark { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .wordmark-dot, .wordmark-tld { color: #a3a3a3; font-weight: 300; }
  .wordmark-dot { margin-inline: -0.04em; }
  .tag { color: #9a9a9a; font-size: 16px; line-height: 1.5; margin: 14px 0 34px; }
  .stores { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: block; text-decoration: none;
    color: #141414; background: #f2f2f2;
    font-size: 16px; font-weight: 700;
    padding: 15px 18px; border-radius: 12px;
    border: 1px solid #f2f2f2;
  }
  .btn.secondary { color: #f2f2f2; background: transparent; border-color: #333; }
  /* #8a8a8a is 5.3:1 on this ground. It was #6a6a6a, 3.4:1, under AA for
     13px type on the one page an advertisement lands on. */
  .note { color: #8a8a8a; font-size: 13px; margin-top: 26px; }
</style>
</head>
<body>
  <main>
    <h1 class="wordmark">zuhd<span class="wordmark-dot">.</span><span class="wordmark-tld">news</span></h1>
    <p class="tag">Global news that barely uses data.<br>No ads, no tracking, no accounts.</p>
    <div class="stores">
      <a id="play" class="btn" href="https://play.google.com/store/apps/details?id=news.zuhd.app" rel="noopener">Get it on Google Play</a>
      <a id="ios" class="btn secondary" href="https://apps.apple.com/app/id6760964753" rel="noopener">Download on the App Store</a>
    </div>
    <p class="note">Text-first and lightweight — it works on slow connections.</p>
  </main>
  <script>
  // Desktop / unknown visitors stay here — wire both buttons with the same params
  // so a manual click-through is still attributed store-side.
  (() => {
    var PLAY = "https://play.google.com/store/apps/details?id=news.zuhd.app";
    var IOS = "https://apps.apple.com/app/id6760964753";
    var qs = (location.search || "").replace(/^\?/, "");
    if (!qs) qs = "utm_source=facebook&utm_medium=paid&utm_content=bridge";
    document.getElementById("play").href = `${PLAY}&referrer=${encodeURIComponent(qs)}`;
    document.getElementById("ios").href = `${IOS}?${qs}`;
  })();
  </script>
</body>
</html>
