<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get the zuhd.news app</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<!-- iOS Smart App Banner -->
<meta name="apple-itunes-app" content="app-id=6760964753">
<meta property="og:title" content="Get the zuhd.news app">
<meta property="og:description" content="Global news that barely uses data. No ads, no tracking, no accounts.">
<meta property="og:url" content="https://zuhd.news/get">
<script>
// Fast path: redirect mobile visitors to their store from <head>, BEFORE the body
// paints, so Android/iOS don't pay for rendering a page they never see. Desktop /
// unknown clients fall through to the rendered page with both store buttons.
(function () {
  var PLAY = "https://play.google.com/store/apps/details?id=news.zuhd.app";
  var IOS = "https://apps.apple.com/app/id6760964753";
  var ua = navigator.userAgent || "";
  var qs = (location.search || "").replace(/^\?/, "");
  // Paid-only landing page (noindex): if the ad link carried no params, still
  // attribute the store visit to paid so Play's Install Referrer can read it
  // (control arm of the bridge-vs-direct destination test).
  if (!qs) qs = "utm_source=facebook&utm_medium=paid&utm_content=bridge";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
    (/Macintosh/.test(ua) && "ontouchend" in document); // iPadOS desktop-mode
  if (isAndroid) location.replace(PLAY + "&referrer=" + encodeURIComponent(qs));
  else if (isIOS) location.replace(IOS + "?" + qs);
})();
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #141414;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .wordmark { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .tag { color: #9a9a9a; font-size: 16px; line-height: 1.5; margin: 14px 0 34px; }
  .stores { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: block; text-decoration: none;
    color: #141414; background: #f2f2f2;
    font-size: 16px; font-weight: 700;
    padding: 15px 18px; border-radius: 12px;
    border: 1px solid #f2f2f2;
  }
  .btn.secondary { color: #f2f2f2; background: transparent; border-color: #333; }
  .note { color: #6a6a6a; font-size: 13px; margin-top: 26px; }
</style>
</head>
<body>
  <main>
    <h1 class="wordmark">zuhd.news</h1>
    <p class="tag">Global news that barely uses data.<br>No ads, no tracking, no accounts.</p>
    <div class="stores">
      <a id="play" class="btn" href="https://play.google.com/store/apps/details?id=news.zuhd.app" rel="noopener">Get it on Google Play</a>
      <a id="ios" class="btn secondary" href="https://apps.apple.com/app/id6760964753" rel="noopener">Download on the App Store</a>
    </div>
    <p class="note">Text-first and lightweight — it works on slow connections.</p>
  </main>
  <script>
  // Desktop / unknown visitors stay here — wire both buttons with the same params
  // so a manual click-through is still attributed store-side.
  (function () {
    var PLAY = "https://play.google.com/store/apps/details?id=news.zuhd.app";
    var IOS = "https://apps.apple.com/app/id6760964753";
    var qs = (location.search || "").replace(/^\?/, "");
    if (!qs) qs = "utm_source=facebook&utm_medium=paid&utm_content=bridge";
    document.getElementById("play").href = PLAY + "&referrer=" + encodeURIComponent(qs);
    document.getElementById("ios").href = IOS + "?" + qs;
  })();
  </script>
</body>
</html>
