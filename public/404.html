<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Not found — zuhd.news</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Source Sans 3", system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; text-align: center; padding: 2rem;
      background: #fff; color: #141414;
    }
    @media (prefers-color-scheme: dark) { body { background: #141414; color: #f4f4f4; } }
    /* This page carries its own styles on purpose — it has to render when the
       stylesheet is the thing that could not be found — so these values are
       copied from the site palette rather than referenced. Keep them in step
       with `.wordmark` / `--text-secondary` in style.css: the dot used to be
       #c0392b, a red that appears nowhere else on the site, and the tld a
       different weight again, so the one page a lost reader sees wore a
       masthead they had never seen before. */
    .wordmark { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; text-decoration: none; color: inherit; }
    .wordmark-dot, .wordmark-tld { color: #555; font-weight: 300; }
    .wordmark-dot { margin-inline: -0.04em; }
    @media (prefers-color-scheme: dark) { .wordmark-dot, .wordmark-tld { color: #a3a3a3; } }
    h1 { font-size: 1rem; font-weight: 600; margin: 0; }
    p { margin: 0; opacity: 0.7; font-size: 0.95rem; }
    a.home { color: inherit; }
  </style>
</head>
<body>
  <a href="/" class="wordmark">zuhd<span class="wordmark-dot">.</span><span class="wordmark-tld">news</span></a>
  <h1>404 — page not found</h1>
  <p>That page doesn't exist. <a class="home" href="/">Back to all stories</a>.</p>
</body>
</html>
